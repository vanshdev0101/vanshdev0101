name: Update profile stats

on:
  schedule:
    - cron: "0 3 * * *" # 08:30 IST daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch streak stats SVG
        run: |
          curl -sSf "https://streak-stats.demolab.com/?user=vanshdev0101&background=2D353B&hide_border=true&border_radius=8&stroke=475258&ring=A7C080&fire=E67E80&currStreakNum=D3C6AA&sideNums=D3C6AA&currStreakLabel=A7C080&sideLabels=859289&dates=859289" -o profile/streak.new.svg

      - name: Fetch activity graph SVG
        run: |
          curl -sSf "https://github-readme-activity-graph.vercel.app/graph?username=vanshdev0101&bg_color=2D353B&color=D3C6AA&line=A7C080&point=E67E80&area=true&area_color=A7C080&title_color=A7C080&hide_border=true&custom_title=commit%20activity" -o profile/activity.new.svg

      # If a fetch failed outright (service down) .new.svg won't exist or
      # won't be SVG. But these services also return a *valid* SVG "Failed
      # to retrieve contributions" error card on a transient GitHub API
      # hiccup on their end - checking for "<svg" alone doesn't catch that,
      # since the error card is itself well-formed SVG. Require a marker
      # that only appears in real data, and reject known error text.
      - name: Validate and promote snapshots
        run: |
          declare -A marker=( [streak]="Total Contributions" [activity]="Contributions" )
          for name in streak activity; do
            f="profile/$name.new.svg"
            if [ -s "$f" ] && grep -q "${marker[$name]}" "$f" && ! grep -qi "failed to retrieve\|error" "$f"; then
              mv "$f" "profile/$name.svg"
            else
              echo "::warning::$name fetch looked invalid, keeping previous snapshot"
              rm -f "$f"
            fi
          done

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg profile/activity.svg
          git diff --cached --quiet || git commit -m "Update profile stats snapshot"
          git push
